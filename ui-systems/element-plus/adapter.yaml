schema: ui-system-adapter/v1
id: element-plus
version: "0.1.0-experimental"
status: experimental
stack_compatibility:
  adapter: vue3-vite
  framework: vue
policy_support: [required, preferred]
documentation:
  authority_order: [installed_types, versioned_source, official_docs, llms_txt, mcp]
  mcp_capabilities: [component_list, component_docs, component_dom, component_changelog]
components:
  - { name: ElButton, semantic: action }
  - { name: ElInput, semantic: text-input }
  - { name: ElDialog, semantic: confirmation }
  - { name: ElDrawer, semantic: overlay }
  - { name: ElTable, semantic: data-table }
  - { name: ElForm, semantic: form }
  - { name: ElPagination, semantic: pagination }
  - { name: ElSelect, semantic: selection }
  - { name: ElDatePicker, semantic: date-range-picker }
  - { name: ElLoading, semantic: loading }
  - { name: ElEmpty, semantic: empty-state }
semantic_mapping:
  primary-action: { component: ElButton, props: { type: primary } }
  secondary-action: { component: ElButton, props: { type: default } }
  confirmation-dialog: { component: ElDialog }
  side-panel: { component: ElDrawer }
  data-grid: { component: ElTable }
  form-container: { component: ElForm }
  pager: { component: ElPagination }
  loading-state: { component: ElLoading }
  empty-state: { component: ElEmpty }
  date-range: { component: ElDatePicker, props: { type: daterange } }
token_mapping:
  color.brand.primary: --el-color-primary
  color.text.primary: --el-text-color-primary
  color.surface.page: --el-bg-color-page
  radius.control: --el-border-radius-base
  size.control.large: --el-component-size-large
constraints:
  - id: prefer-system-component
    severity: warning
    message: UI System 已有语义组件时优先复用，不重复实现基础控件。
  - id: no-internal-dom-overrides
    severity: failure
    message: 不直接覆盖组件内部 DOM class；优先使用 Props、Slots 和 Token。
  - id: versioned-evidence
    severity: failure
    message: llms.txt 或 MCP 证据必须记录与安装版本的对应关系。
  - id: runtime-dependency-lifecycle
    severity: failure
    message: 实际使用的 UI runtime 必须作为锁定的生产依赖保留；仅试用且源码未引用时才移除，更换框架必须先迁移和验证。
